<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego de prevención</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #1c1c24;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #juego {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      image-rendering: pixelated;
      touch-action: none;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="juego" width="900" height="600"></canvas>
  <script src="juego.js"></script>
</body>
</html>
